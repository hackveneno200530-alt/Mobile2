<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Explorar
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Explorar</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for (product of mockProducts; track product.productId) {
      <ion-item>
        <ion-label>
          <h2>{{ product.name }}</h2>
          <p>{{ product.category }}</p>
        </ion-label>
        <ion-note slot="end">${{ product.price }}</ion-note>
        <ion-button slot="end" fill="outline" (click)="addToCart(product)">
          <ion-icon slot="start" name="cart-outline"></ion-icon>
          Agregar
        </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
