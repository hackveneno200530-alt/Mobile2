<ion-tabs>

  <ion-tab-bar slot="bottom" class="main-tab-bar">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="storefront-outline"></ion-icon>
      <ion-label>Explorar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
      <ion-label>Carrito</ion-label>
      @if (cart.totalCount() > 0) {
        <ion-badge color="danger" class="cart-badge">{{ cart.totalCount() }}</ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="orders" href="/tabs/orders">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>Pedidos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="images"></ion-icon>
      <ion-label>Fotos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="datasource" href="/tabs/datasource">
      <ion-icon aria-hidden="true" name="server-outline"></ion-icon>
      <ion-label>Orígenes</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
